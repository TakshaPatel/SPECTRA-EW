name: Deception Test
description: Scenario designed to test AI response to deceptive emitters

world:
  map_width: 600.0
  map_height: 600.0
  max_ticks: 150
  environment:
    propagation_loss_exponent: 2.0
    ambient_noise_db: -100.0
    weather_attenuation: 0.0
    terrain_masking: false

entities:
  - kind: Aircraft
    faction: Blue
    position:
      x: 150.0
      y: 300.0
    label: Blue Recon
    emits:
      - channel: 1
        frequency_mhz: 2400.0
        category: Communication
        power_db: 30.0
    receives: true

  - kind: Drone
    faction: Blue
    position:
      x: 200.0
      y: 350.0
    label: Blue Decoy Drone
    emits:
      - channel: 5
        frequency_mhz: 9000.0
        category: Radar
        power_db: 45.0
    receives: true

  - kind: Aircraft
    faction: Red
    position:
      x: 450.0
      y: 280.0
    label: Red Strike
    emits:
      - channel: 3
        frequency_mhz: 3500.0
        category: Radar
        power_db: 55.0
    receives: true

  - kind: Drone
    faction: Red
    position:
      x: 480.0
      y: 320.0
    label: Red Deception Drone
    emits:
      - channel: 3
        frequency_mhz: 3500.0
        category: Radar
        power_db: 60.0
    receives: false
