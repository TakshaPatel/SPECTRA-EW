[workspace]
resolver = "2"
members = [
    "crates/spectra-core",
    "crates/spectra-sensors",
    "crates/spectra-ew",
    "crates/spectra-ai",
    "crates/spectra-sim",
    "crates/spectra-experiments",
    "crates/spectra-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/spectra-sim/spectra"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
rand = "0.8"
rand_chacha = "0.3"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
